<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="hard-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="hard-shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Clean Dark Canvas Background -->
  <rect width="512" height="512" rx="44" fill="#0e0e0e"/>

  <!-- Subtle Dot Grid Texture -->
  <pattern id="grid-dots" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="1.5" fill="#222222"/>
  </pattern>
  <rect width="512" height="512" rx="44" fill="url(#grid-dots)"/>

  <!-- Gen-Z Sparkle Accents in corners -->
  <path d="M 88 56 Q 88 80 64 80 Q 88 80 88 104 Q 88 80 112 80 Q 88 80 88 56 Z" fill="#baff00" stroke="#000000" stroke-width="2.5" filter="url(#hard-shadow-sm)"/>
  <circle cx="436" cy="76" r="10" fill="#ff2a85" stroke="#000000" stroke-width="3" filter="url(#hard-shadow-sm)"/>
  <path d="M 424 436 Q 424 452 408 452 Q 424 452 424 468 Q 424 452 440 452 Q 424 452 424 436 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="84" cy="436" r="6" fill="#baff00" stroke="#000000" stroke-width="2"/>

  <!-- Tilted sticker badge: offset shadow -->
  <rect x="114" y="114" width="284" height="284" rx="42" fill="#000000" transform="rotate(-3 256 256)"/>
  <!-- Lime sticker card with heavy border -->
  <rect x="108" y="108" width="284" height="284" rx="42" fill="#baff00" stroke="#000000" stroke-width="8" transform="rotate(-3 256 256)"/>

  <!-- "V." emblem -->
  <g transform="rotate(-3 256 256)">
    <polygon points="135,166 196,308 226,308 287,166 246,166 211,257 177,166" fill="#000000" transform="translate(7, 7)"/>
    <polygon points="135,166 196,308 226,308 287,166 246,166 211,257 177,166" fill="#131313" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Hot-pink chamfer on right arm -->
    <polygon points="246,166 287,166 274,200 233,200" fill="#ff2a85" stroke="#000000" stroke-width="3.5"/>
    <!-- Dot -->
    <circle cx="324" cy="294" r="21" fill="#000000" transform="translate(6, 6)"/>
    <circle cx="324" cy="294" r="21" fill="#131313" stroke="#000000" stroke-width="4.5"/>
  </g>
</svg>
