<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAULT — Transactions</title>
  <meta name="description" content="VAULT — browse, filter and export every transaction." />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/transactions.css" />
</head>
<body>

<div class="page-wrapper">

  <!-- ══════════════════════════════════
       HEADER
  ══════════════════════════════════ -->
  <header class="site-header">
    <a href="index.html" class="site-logo">VAULT<span>.</span></a>

    <nav aria-label="Primary navigation">
      <ul class="nav-pills">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="transactions.html" class="active">Transactions</a></li>
        <li><a href="budget.html">Budget</a></li>
        <li><a href="insights.html">Insights</a></li>
      </ul>
    </nav>

    <span class="header-badge">● Live</span>
  </header>

  <!-- ══════════════════════════════════
       PAGE HERO
  ══════════════════════════════════ -->
  <section class="page-hero" aria-label="Transactions overview">
    <div class="page-hero-left">
      <div class="page-hero-eyebrow" id="eyebrow"></div>
      <h1 class="page-hero-title display">Recent<br><em>Activity</em></h1>
    </div>

    <div class="page-hero-right">
      <div class="hero-stats" id="hstats"></div>
    </div>
  </section>

  <!-- ══════════════════════════════════
       FILTER BAR
  ══════════════════════════════════ -->
  <div class="filter-bar" role="toolbar" aria-label="Filter transactions">
    <span class="filter-label">Filter:</span>

    <button class="filter-chip active pink"  id="f-all"     onclick="filterAll(this)">All</button>
    <button class="filter-chip"              id="f-expense" onclick="filterBy(this,'expense')">Expenses</button>
    <button class="filter-chip" id="f-income"  onclick="filterBy(this,'income')">Income</button>

    <div class="filter-sep" aria-hidden="true"></div>

    <button class="filter-chip" onclick="filterTag(this,'food')">🍕 Food</button>
    <button class="filter-chip" onclick="filterTag(this,'gaming')">🎮 Gaming</button>
    <button class="filter-chip" onclick="filterTag(this,'transport')">🚇 Transport</button>
    <button class="filter-chip" onclick="filterTag(this,'coffee')">☕ Coffee</button>
    <button class="filter-chip" onclick="filterTag(this,'music')">🎵 Music</button>
    <button class="filter-chip" onclick="filterTag(this,'fashion')">👟 Fashion</button>

    <div class="search-box">
      <input
        class="search-input mono"
        type="search"
        placeholder="Search transactions…"
        aria-label="Search transactions"
        oninput="searchTxns(this.value)"
      />
    </div>
  </div>

  <!-- ══════════════════════════════════
       MAIN LAYOUT
  ══════════════════════════════════ -->
  <div class="main-layout">

    <!-- LEFT: Bento Transaction Container -->
    <section aria-label="Transaction list">

      <div class="txn-bento">
        <div class="txn-bento-header">
          <h2 class="txn-bento-title display">Recent Activity 🧾</h2>
          <span class="txn-count-badge" id="txn-count">12 ENTRIES</span>
        </div>

        <div class="txn-scroll-area" id="txn-list"></div><!-- /txn-scroll-area -->
      </div><!-- /txn-bento -->

    </section>

    <!-- RIGHT: Sidebar -->
    <aside class="sidebar" aria-label="Transaction summary">

      <!-- Monthly Summary -->
      <div class="card summary-card">
        <div class="card-label">📅 Feb 2026 Summary</div>
        <div class="summary-net display" id="sum-net"></div>
        <div class="summary-sub mono">Net this month</div>
        <div class="summary-split" id="sum-split"></div>
      </div>

      <!-- Spend by Category -->
      <div class="card breakdown-card">
        <h3 class="breakdown-title display">By Category 📊</h3>
        <div id="bd"></div>
      </div>

      <!-- Quick Stats -->
      <div class="card quickstats-card">
        <h3 class="quickstats-title display">Quick Stats ⚡</h3>
        <div class="qs-grid" id="qs"></div>
      </div>

      <!-- Export -->
      <div class="card export-card">
        <h3 class="export-title display">Export Data 📤</h3>
        <div class="export-btns">
          <button class="btn btn-black" onclick="exportCSV()">↓ Download CSV</button>
          <button class="btn btn-white" onclick="exportPDF()">↓ Export PDF</button>
          <button class="btn btn-black" onclick="copySheet()">⊞ Copy to Sheet</button>
          <button class="btn btn-white" onclick="clearAll()">🗑 Clear All Data</button>
        </div>
      </div>

    </aside>
  </div><!-- /main-layout -->

  <!-- ══════════════════════════════════
       FOOTER
  ══════════════════════════════════ -->
  <footer class="site-footer">
    <div class="footer-logo">VAULT.</div>
    <div>© 2026 VAULT — Built for broke &amp; ambitious 💀</div>
    <div><a href="#" onclick="resetDemo();return false" style="color:inherit">Reset demo data</a> · <a href="#" onclick="clearAll();return false" style="color:inherit">Clear all data</a></div>
  </footer>

</div><!-- /page-wrapper -->

<!-- Core: state, derivations, shared UI -->
<script src="assets/js/core/utils.js"></script>
<script src="assets/js/core/seed.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/stats.js"></script>
<script src="assets/js/core/insights.js"></script>
<script src="assets/js/core/ui.js"></script>
<!-- Page -->
<script src="assets/js/pages/transactions.js"></script>
</body>
</html>
